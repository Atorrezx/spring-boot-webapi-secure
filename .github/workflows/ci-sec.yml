name: CI - Spring Boot DevSecOps

on:
  push:
    branches: [ 'feature/**', 'bugfix/**', 'hotfix/**' ]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx2g'

jobs:
  # ------------------------------------------------------------------
  # 1. Build + Unit/Integration Tests + Code Coverage
  # ------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build & run tests with coverage
        run: mvn -B clean verify

      - name: Upload test & coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/failsafe-reports/
          retention-days: 7

  # ------------------------------------------------------------------
  # 2. SAST - Semgrep (never fails on findings; the quality gate decides)
  # ------------------------------------------------------------------
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --config .semgrep.yml \
            --metrics=on \
            --json-output=semgrep-results.json \
            --sarif-output=semgrep-results.sarif \
            src/main/java

      - name: Upload Semgrep reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-reports
          path: |
            semgrep-results.json
            semgrep-results.sarif
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------
  # 3. SpotBugs (report only)
  # ------------------------------------------------------------------
  spotbugs:
    name: SAST - SpotBugs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run SpotBugs
        run: mvn -B compile spotbugs:spotbugs

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-report
          path: |
            target/spotbugsXml.xml
            target/spotbugs-report.json
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------
  # 4. Quality Gate - fails on critical findings or a failed build
  # ------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [build-and-test, sast-semgrep, spotbugs]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Evaluate quality gate
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          status=0
          if echo "$JOB_RESULTS" | grep -qE 'failure|cancelled'; then
            echo "::error::A required job did not succeed ($JOB_RESULTS)"
            status=1
          fi
          python3 scripts/quality_gate.py \
            --semgrep reports/semgrep-reports/semgrep-results.json \
            --spotbugs reports/spotbugs-report/spotbugsXml.xml || status=1
          exit "$status"
