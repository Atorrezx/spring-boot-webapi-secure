name: CI/CD - Spring Boot DevSecOps

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # Optional: also trigger on version tags
  # tags: [ 'v*.*.*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. your-org/your-app

jobs:
  # ==================================================================
  # CI JOBS (same as before – kept for completeness)
  # ==================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build & test with coverage
        run: mvn -B clean verify

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          retention-days: 7

  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --config .semgrep.yml \
            --metrics=on \
            --json-output=semgrep-results.json \
            --sarif-output=semgrep-results.sarif \
            src/main/java
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-reports
          path: |
            semgrep-results.json
            semgrep-results.sarif
          if-no-files-found: warn
          retention-days: 14

  spotbugs:
    name: SAST - SpotBugs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - name: Run SpotBugs
        run: mvn -B compile spotbugs:spotbugs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: warn
          retention-days: 14

  # Required status check for branch protection
  quality-gate:
    name: CI/CD Quality Gate
    runs-on: ubuntu-latest
    needs: [build-and-test, sast-semgrep, sast-codeql, spotbugs]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: reports
      - name: Evaluate quality gate
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          status=0
          if echo "$JOB_RESULTS" | grep -qE 'failure|cancelled'; then
            echo "::error::A required job did not succeed ($JOB_RESULTS)"
            status=1
          fi
          python3 scripts/quality_gate.py \
            --semgrep reports/semgrep-reports/semgrep-results.json \
            --spotbugs reports/spotbugs-report/spotbugsXml.xml || status=1
          exit "$status"

  # ==================================================================
  # CD JOBS – only on main (or tags)
  # ==================================================================
  docker-build-scan-push:
    name: Docker Build → Scan → Push
    runs-on: ubuntu-latest
    needs: [quality-gate]   # wait for the quality gate
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write          # needed to push to GHCR
      security-events: write   # for Trivy SARIF upload
      id-token: write          # for optional image signing later

    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false                    # build first, scan, then push
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}   # tags output is multi-line
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'                 # fail the job on CRITICAL/HIGH

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Push image to GHCR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Optional: Deploy to Staging (example with a simple SSH or K8s)
  # ------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build-scan-push
    if: false #github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.yourapp.com   # optional status check URL

    steps:
      - name: Checkout (for manifests)
        uses: actions/checkout@v4

      # Example 1: Simple SSH + docker compose (good for small teams)
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.STAGING_HOST }}
      #     username: ${{ secrets.STAGING_USER }}
      #     key: ${{ secrets.STAGING_SSH_KEY }}
      #     script: |
      #       docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      #       docker compose -f /opt/app/docker-compose.yml up -d

      # Example 2: Kubernetes with kubectl (more production-like)
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > $HOME/.kube/config

      - name: Deploy to staging
        run: |
          # Update image tag in deployment (simple sed example)
          sed -i "s|image:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker-build-scan-push.outputs.image-digest }}|" k8s/staging/deployment.yaml
          kubectl apply -f k8s/staging/
          kubectl rollout status deployment/your-app -n staging --timeout=120s

  # ------------------------------------------------------------------
  # Optional: Production promotion (manual approval)
  # ------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging, docker-build-scan-push]
    if: false #github.ref == 'refs/heads/main'
    environment:
      name: production          # requires manual approval in GitHub UI
      url: https://yourapp.com

    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig (prod)
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config
      - name: Deploy to production
        run: |
          sed -i "s|image:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker-build-scan-push.outputs.image-digest }}|" k8s/production/deployment.yaml
          kubectl apply -f k8s/production/
          kubectl rollout status deployment/your-app -n production --timeout=180s