spring.application.name=springboot-devsecops-lab

spring.datasource.url=jdbc:h2:mem:devsecopsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

spring.sql.init.mode=always

# LAB: configuracion deliberadamente insegura.
management.endpoints.web.exposure.include=*
management.endpoint.env.show-values=always
server.error.include-message=always
server.error.include-stacktrace=always

# Credencial ficticia. Nunca utilizar valores reales en este repositorio.
lab.external.api-key=${LAB_EXTERNAL_API_KEY:}

# Credenciales de login: se inyectan por variables de entorno (sin valores por defecto).
app.auth.username=${APP_AUTH_USERNAME:}
app.auth.password=${APP_AUTH_PASSWORD:}
